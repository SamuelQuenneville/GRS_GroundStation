---
#--------------------------------------------------
#                Controller Config                #
#--------------------------------------------------
#
#
GcsConfiguration:
  numUavs: 1
  verbose: false
  hlcFrequency: 20.0
  controlMode: MPC        # MPC | MATLAB | ATTITUDE_FILE

Pixhawk:
  sitl: false               # true -> base IP + port*increment (SITL). false -> use endpoints below.
  remoteIP: 127.0.0.1
  tcpPort: 5760
  tcpPortIncrement: 10

  # Only read when sitl: false — one dedicated IP:port per real Pixhawk.
  # We use UDP so IP is WI-FI interface on GCS laptop
  endpoints:
    - {id: 1, ip: 192.168.50.10, port: 14400}
    #- {id: 2, ip: 192.168.50.10, port: 14500}
    - {id: 3, ip: 192.168.50.10, port: 14600}

# Connect via TCP
Catapults:
  - {id: 1, port: 5800, ip: 192.168.50.20}
  #- {id: 2, port: 5801, ip: 192.168.50.21}

SolverConfiguration:
  # NX/NU/NP/ND/NL0/N/DT below must match solver_oneGround_nmpc_meta.h
  # (auto-generated alongside the solver by export_solver_oneGround_nmpc.m
  # -- OG_NX/OG_NU/OG_NP/OG_ND/OG_NL0/OG_N/OG_DT) exactly. SCALES_STATES/
  # SCALES_CONTROLS and the bounds below already matched
  # solver_oneGround_nmpc's meta header as of this update -- re-verify
  # against it any time the MATLAB side re-exports.
  NX: 8
  NU: 3
  NP: 3    # wind (shared, not per-UAV)
  ND: 5    # disturbance bias, from NMHE -- zero vector until NMHE is wired in
  NL0: 1   # tether rest length
  N: 30
  DT: 0.05
  NUM_UAVS: 1

  # Tether rest length [m], packed into every solve's L0 parameter. Fixed
  # here for now (Phase 2) -- see tether-length-parameterization.md for the
  # GCS-settable version this will become.
  L0: 30.0

  # Q(8) | R(3) | Qf(8) | Rdu(3) | Rdu0(3) -- 25 entries, per
  # build_nlp_oneGround_nmpc.m's Weight layout. The WEIGHT this file
  # previously shipped ([0.1,0.1,1,1,1,1,1,1, 5,1,1, 10], 12 entries) used
  # an incompatible older scheme -- a single scalar Qf_val instead of a
  # full nx-length Qf diagonal, and no Rdu/Rdu0 slots at all -- left over
  # from before build_nlp_oneGround_nmpc.m's current Weight layout was
  # finalized. Q and R below are carried over unchanged from that file
  # (same 8 state weights, same 3 control weights); Qf is the old scalar
  # Qf_val=10 broadcast across all 8 states as the closest literal reading
  # of the old single-value intent -- NOT independently validated for this
  # layout, retune it. Rdu/Rdu0 (the new stage-to-stage and first-stage
  # control RATE penalties) are left at 0, matching "no rate penalty",
  # since there's no prior value for them to carry over.
  #              x, y,  z, vx, vy, vz, roll, pitch |  T, roll, pitch |              Qf_val (broadcast)             |    Rdu (dU)    |   Rdu0 (dU0)
  WEIGHT: [0.1, 0.1,  1,  1,  1,  1,    1,     1,     5,    1,     1,   10, 10, 10, 10, 10, 10, 10, 10,   0, 0, 0,        0, 0, 0]
  LBX_STATES: [-.inf, -.inf, -.inf, -40.0, -40.0, -10.0, -0.5236, -0.6981]
  UBX_STATES: [ .inf,  .inf,   0.0,  40.0,  40.0,  10.0,  0.5236,  0.6981]
  LBX_CONTROLS: [ 0.0, -0.5236, -0.6981]
  UBX_CONTROLS: [60.0,  0.5236,  0.6981]
  SCALES_STATES: [100.0, 100.0, 50.0, 30.0, 30.0, 15.0, 0.4, 0.4]
  SCALES_CONTROLS: [30.0, 0.4, 0.4]