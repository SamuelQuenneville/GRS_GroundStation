---
#--------------------------------------------------
#                Controller Config                #
#--------------------------------------------------
#
#
GcsConfiguration:
  numUavs: 1
  verbose: false
  hlcFrequency: 20.0
  nmheFrequency: 5.0      # NMHE update rate -- starting point per gcs-sitl-integration-plan.md's Decisions, not yet validated
  controlMode: MPC        # MPC | MATLAB | ATTITUDE_FILE

Pixhawk:
  sitl: false               # true -> base IP + port*increment (SITL). false -> use endpoints below.
  remoteIP: 127.0.0.1
  tcpPort: 5760
  tcpPortIncrement: 10

  # Only read when sitl: false — one dedicated IP:port per real Pixhawk.
  # We use UDP so IP is WI-FI interface on GCS laptop
  endpoints:
    - {id: 1, ip: 192.168.50.10, port: 14400}
    #- {id: 2, ip: 192.168.50.10, port: 14500}
    - {id: 3, ip: 192.168.50.10, port: 14600}

# Connect via TCP
Catapults:
  - {id: 1, port: 5800, ip: 192.168.50.20}
  #- {id: 2, port: 5801, ip: 192.168.50.21}

SolverConfiguration:
  # NX/NU/NP/ND/NL0/N/DT below must match solver_oneGround_nmpc_meta.h
  # (auto-generated alongside the solver by export_solver_oneGround_nmpc.m
  # -- OG_NX/OG_NU/OG_NP/OG_ND/OG_NL0/OG_N/OG_DT) exactly. SCALES_STATES/
  # SCALES_CONTROLS and the bounds below already matched
  # solver_oneGround_nmpc's meta header as of this update -- re-verify
  # against it any time the MATLAB side re-exports.
  NX: 8
  NU: 3
  NP: 3    # wind (shared, not per-UAV)
  ND: 5    # disturbance bias, from NMHE -- zero vector until NMHE is wired in
  NL0: 1   # tether rest length
  N: 30
  DT: 0.05
  NUM_UAVS: 1

  # Tether rest length [m], packed into every solve's L0 parameter. Fixed
  # here for now (Phase 2) -- see tether-length-parameterization.md for the
  # GCS-settable version this will become.
  L0: 30.0

  # Angle-of-attack path-constraint bound [rad], symmetric -- must match
  # build_nlp_oneGround_nmpc.m's own 'alpha_max' option (deg2rad(14) by
  # MATLAB default, re-verify against solver_oneGround_nmpc_meta.h/the
  # MATLAB build call any time it re-exports). Packed into every solve's
  # g bounds by MpcController::m_packInequalityBounds() -- previously
  # missing entirely, which silently enforced alpha == 0 instead of this
  # bound; see gcs-sitl-integration-plan.md's open questions.
  ALPHA_MAX: 0.244346  # deg2rad(14)

  # Q(8) | R(3) | Qf(8) | Rdu(3) | Rdu0(3) -- 25 entries, per
  # build_nlp_oneGround_nmpc.m's Weight layout. The WEIGHT this file
  # previously shipped ([0.1,0.1,1,1,1,1,1,1, 5,1,1, 10], 12 entries) used
  # an incompatible older scheme -- a single scalar Qf_val instead of a
  # full nx-length Qf diagonal, and no Rdu/Rdu0 slots at all -- left over
  # from before build_nlp_oneGround_nmpc.m's current Weight layout was
  # finalized. Q and R below are carried over unchanged from that file
  # (same 8 state weights, same 3 control weights); Qf is the old scalar
  # Qf_val=10 broadcast across all 8 states as the closest literal reading
  # of the old single-value intent -- NOT independently validated for this
  # layout, retune it. Rdu/Rdu0 (the new stage-to-stage and first-stage
  # control RATE penalties) are left at 0, matching "no rate penalty",
  # since there's no prior value for them to carry over.
  #              x, y,  z, vx, vy, vz, roll, pitch |  T, roll, pitch |              Qf_val (broadcast)             |    Rdu (dU)    |   Rdu0 (dU0)
  WEIGHT: [0.1, 0.1,  1,  1,  1,  1,    1,     1,     5,    1,     1,   10, 10, 10, 10, 10, 10, 10, 10,   0, 0, 0,        0, 0, 0]
  LBX_STATES: [-.inf, -.inf, -.inf, -40.0, -40.0, -10.0, -0.5236, -0.6981]
  UBX_STATES: [ .inf,  .inf,   0.0,  40.0,  40.0,  10.0,  0.5236,  0.6981]
  LBX_CONTROLS: [ 0.0, -0.5236, -0.6981]
  UBX_CONTROLS: [60.0,  0.5236,  0.6981]
  SCALES_STATES: [100.0, 100.0, 50.0, 30.0, 30.0, 15.0, 0.4, 0.4]
  SCALES_CONTROLS: [30.0, 0.4, 0.4]

# Presence of this section is what enables NMHE -- ControlInterface only
# constructs an Estimator when it exists (see
# ConfigurationParser::parseEstimatorConfig()); remove/comment it out to run
# with wind/d hardcoded at zero, same as before Phase 4. NX/NU/NP/ND/NL0/M/DT
# below must match nmhe_oneGround_meta.h (auto-generated alongside the
# solver by export_nmhe_oneGround.m -- NMHE_OG_NX/NMHE_OG_NU/NMHE_OG_NP/
# NMHE_OG_ND/NMHE_OG_NL0/NMHE_OG_M/NMHE_OG_DT) exactly -- re-verify against
# it any time the MATLAB side re-exports. X_SCALE/WIND_SCALE/D_SCALE are
# scaling_oneUav.m's own x_scale/wind_scale/d_scale (single source of truth
# on the MATLAB side -- X_SCALE here is the same vector as
# SCALES_STATES above, since both the NMPC and NMHE builders pull it from
# the same scaling_oneUav.m). WIND_MAX/DF_MAX/B_ATT_MAX are
# build_nmhe_oneGround.m's own defaults (wind_max=25, dF_max=30,
# b_att_max=deg2rad(15)) -- see estimatorConfig's own comment in
# controllerStructures.h for why these still have to be packed at runtime
# despite being "baked in" at MATLAB build time.
EstimatorConfiguration:
  NX: 8
  NU: 3
  NP: 3
  ND: 5
  NL0: 1
  M: 40
  DT: 0.05
  NUM_UAVS: 1

  # Tether rest length [m] -- same physical tether as SolverConfiguration's
  # own L0 above, packed into NMHE's L0_param block every estimate() solve
  # (see OneUavNmheBackend::packParameters()). Previously missing from this
  # section entirely -- estimatorConfig's decode() has always required it,
  # this file just never had it, which is what threw "invalid node; first
  # invalid key: L0" once ALPHA_MAX's own missing-key error was fixed.
  L0: 30.0

  # W_MEAS(8) | W_WINDP(3) | W_DP(5) -- measurement-fit and arrival-cost
  # weights, per build_nmhe_oneGround.m's Objective section. NOT pulled
  # from any validated MATLAB sim run (run_nmhe.m's own call sites weren't
  # available to this session to carry values over from, unlike Phase 3's
  # WEIGHT) -- flat, unvalidated first-pass guesses (trust position/
  # velocity/attitude measurements roughly equally, weak arrival-cost pull
  # toward the prior). Retune before trusting NMHE's output for anything.
  W_MEAS: [10, 10, 10, 10, 10, 10, 10, 10]
  W_WINDP: [1, 1, 1]
  W_DP: [1, 1, 1, 1, 1]

  WIND_MAX: 25.0
  DF_MAX: 30.0
  B_ATT_MAX: 0.261799  # deg2rad(15)

  X_SCALE: [100.0, 100.0, 50.0, 30.0, 30.0, 15.0, 0.4, 0.4]
  WIND_SCALE: [10.0, 10.0, 10.0]
  D_SCALE: [20.0, 20.0, 20.0, 0.15, 0.15]