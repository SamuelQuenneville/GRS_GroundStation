---
#--------------------------------------------------
#                Controller Config                #
#--------------------------------------------------
#
#
GcsConfiguration:
  numUavs: 1
  verbose: false
  hlcFrequency: 20.0
  nmheFrequency: 5.0      # NMHE update rate -- starting point per gcs-sitl-integration-plan.md's Decisions, not yet validated
  controlMode: MPC        # MPC | MATLAB | ATTITUDE_FILE

Pixhawk:
  sitl: false               # true -> base IP + port*increment (SITL). false -> use endpoints below.
  remoteIP: 127.0.0.1
  tcpPort: 5760
  tcpPortIncrement: 10

  # Only read when sitl: false — one dedicated IP:port per real Pixhawk.
  # We use UDP so IP is WI-FI interface on GCS laptop
  endpoints:
    - {id: 1, ip: 192.168.50.10, port: 14400}
    #- {id: 2, ip: 192.168.50.10, port: 14500}
    - {id: 3, ip: 192.168.50.10, port: 14600}

# Connect via TCP
Catapults:
  - {id: 1, port: 5800, ip: 192.168.50.20}
  #- {id: 2, port: 5801, ip: 192.168.50.21}

SolverConfiguration:
  # Must describe the generated solver (GRS_Controller 04_tools/generate_solvers.m,
  # build_nlp_oneGround_nmpc.m / _lmpc.m and solver_oneGround_nmpc_meta.h).
  # Decision vector [z0 u0 ... zN], z = [x; previous control]: MpcController
  # derives it from NX/NU/N and refuses a solver of another layout.
  NX: 8
  NU: 3
  NP: 3    # wind
  ND: 5    # [dFx dFy dFz b_roll b_pitch]
  NL0: 1   # tether rest length
  N: 30
  DT: 0.05
  NUM_UAVS: 1
  # nmpc (default) or lmpc, same values below for both.
  CONTROLLER: nmpc

  # Tether rest length [m], packed into every solve's L0 parameter.
  L0: 30.0

  # Angle-of-attack bound [rad] (build option 'alpha_max').
  ALPHA_MAX: 0.244346  # deg2rad(14)

  # Q(8) | R(3) | Qf(8) | Rdu(3) | Rdu0(3), GRS_Controller tuning_oneGround.m.
  #         x,   y,  z, vx, vy, vz, roll, pitch | T, roll, pitch | Qf = 10 Q | Rdu | Rdu0 = 2 Rdu
  WEIGHT: [0.1, 0.1, 1, 1, 1, 1, 1, 1,   5, 1, 1,   1, 1, 10, 10, 10, 10, 10, 10,   0.5, 2.0, 2.0,   1.0, 4.0, 4.0]
  # State bounds apply from the second stage on (the first is the measured state).
  LBX_STATES: [-.inf, -.inf, -.inf, -40.0, -40.0, -10.0, -0.5236, -0.6981]
  UBX_STATES: [ .inf,  .inf,   0.0,  40.0,  40.0,  10.0,  0.5236,  0.6981]
  LBX_CONTROLS: [ 0.0, -0.5236, -0.6981]
  UBX_CONTROLS: [60.0,  0.5236,  0.6981]
  # scaling_oneUav.m
  SCALES_STATES: [100.0, 100.0, 50.0, 30.0, 30.0, 15.0, 0.4, 0.4]
  SCALES_CONTROLS: [30.0, 0.4, 0.4]

# Enables the NMHE when present (remove it to run with wind and d at zero).
# Must describe nmhe_oneGround (build_nmhe_oneGround.m, nmhe_oneGround_meta.h).
# The estimator warm starts from its previous solution.
EstimatorConfiguration:
  NX: 8
  NU: 3
  NP: 3
  ND: 5
  NL0: 1
  M: 40
  DT: 0.05
  NUM_UAVS: 1

  # Tether rest length [m], as SolverConfiguration.L0.
  L0: 30.0

  # W_MEAS(8) | W_WINDP(3) | W_DP(5), GRS_Controller tuning_oneGround.m.
  W_MEAS: [5, 5, 5, 2, 2, 2, 1, 1]
  W_WINDP: [0.05, 0.05, 0.05]
  W_DP: [0.02, 0.02, 0.02, 0.2, 0.2]

  # |wind_i| and |d_i| bounds, physical units (build_nmhe_oneGround.m defaults).
  WIND_BOUND: [25.0, 25.0, 25.0]
  D_BOUND: [30.0, 30.0, 30.0, 0.261799, 0.261799]   # [dF N (3), b_roll rad, b_pitch rad]

  # scaling_oneUav.m
  X_SCALE: [100.0, 100.0, 50.0, 30.0, 30.0, 15.0, 0.4, 0.4]
  WIND_SCALE: [10.0, 10.0, 10.0]
  D_SCALE: [20.0, 20.0, 20.0, 0.15, 0.15]
